```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--primary);
        }

        .form-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .shopping-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .shopping-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid #e5e7eb;
            animation: fadeIn 0.3s ease;
        }

        .shopping-item:last-child {
            border-bottom: none;

        .item-info {
            display: flex;

    </style>
</head>
<body>

    <div class="container">
        <h1>Lista de Compras</h1>
        
        <form id="item-form" class="form-group">
            <input type="text" id="item-input" placeholder="Adicionar novo produto..." autocomplete="off" required>
            <button type="submit">Adicionar</button>
        </form>

        <ul id="shopping-list" class="shopping-list">
            <!-- Os itens serão inseridos aqui via JavaScript -->
        </ul>
    </div>

    <script>
        const form = document.getElementById('item-form');
        const input = document.getElementById('item-input');
        const list = document.getElementById('shopping-list');

        // Carregar itens do localStorage ao iniciar
        document.addEventListener('DOMContentLoaded', loadItems);

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const itemName = input.value.trim();
            if (itemName === '') return;

            addItemToDOM(itemName, false);
            saveItems();

            input.value = '';
            input.focus();
        });

        function addItemToDOM(text, completed) {
            const li = document.createElement('li');
            li.className = `shopping-item ${completed ? 'completed' : ''}`;

            const itemInfo = document.createElement('div');
            itemInfo.className = 'item-info';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = completed;
            
            checkbox.addEventListener('change', function() {
                li.classList.toggle('completed', checkbox.checked);
                saveItems();
            });

            const span = document.createElement('span');
            span.className = 'item-text';
            span.textContent = text;

            itemInfo.appendChild(checkbox);
            itemInfo.appendChild(span);

            // Permitir clicar no texto também para marcar
            itemInfo.addEventListener('click', function(e) {
                if (e.target !== checkbox) {
                    checkbox.checked = !checkbox.checked;
                    li.classList.toggle('completed', checkbox.checked);
                    saveItems();
                }
            });

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '🗑️';
            deleteBtn.title = 'Excluir';
            
            deleteBtn.addEventListener('click', function() {
                li.style.animation = 'fadeIn 0.3s ease reverse';
                setTimeout(() => {
                    li.remove();
                    checkEmptyState();
                    saveItems();
                }, 200);
            });

            li.appendChild(itemInfo);
            li.appendChild(deleteBtn);
            list.appendChild(li);

            checkEmptyState();
        }

        function checkEmptyState() {
            const existingEmpty = document.getElementById('empty-state');
            if (list.children.length === 0) {
                if (!existingEmpty) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.id = 'empty-state';
                    emptyMsg.className = 'empty-state';
                    emptyMsg.textContent = 'Sua lista está vazia.';
                    list.appendChild(emptyMsg);
                }
            } else {
                if (existingEmpty) {
                    existingEmpty.remove();
                }
            }
        }

        function saveItems() {
            const items = [];
            const liElements = list.querySelectorAll('.shopping-item');
            
            liElements.forEach(li => {
                const text = li.querySelector('.item-text').textContent;
                const completed = li.classList.contains('completed');
                items.push({ text, completed });
            });

            localStorage.setItem('shopping_items', JSON.stringify(items));
        }

        function loadItems() {
            const savedItems = JSON.parse(localStorage.getItem('shopping_items')) || [];
            list.innerHTML = '';
            
            if (savedItems.length === 0) {
                checkEmptyState();
            } else {
                savedItems.forEach(item => {
                    addItemToDOM(item.text, item.completed);
                });
            }
        }
    </script>
</body>
</html>
