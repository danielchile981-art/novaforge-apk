    <style>
        :root {
            --primary: #4f46e5;

            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

            box-sizing: border-box;

            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;

        }

        body {
            display: flex;
            flex-direction: column;

        }

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 700;

        }

            outline: none;

</head>
<body>

    <header>
        <div class="app-title">
            🛒 Lista Fácil
        </div>
        <div class="stats" id="statsCounter">0/0 itens</div>
    </header>

    <main>
        <div class="input-card">
            <form id="itemForm" onsubmit="addItem(event)">
                <div class="input-group">
                    <div class="input-row">
                        <input type="text" id="itemName" placeholder="O que deseja comprar?" required autocomplete="off">
                        <input type="number" id="itemQty" value="1" min="1" max="999" placeholder="Qtd">
                    </div>
                    <button type="submit" class="btn-primary">
                        <span>Adicionar</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="actions-bar" id="actionsBar" style="display: none;">
            <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Sua Lista</span>
            <button class="btn-text" onclick="clearCompleted()">Limpar comprados</button>
        </div>

        <div class="list-container" id="listContainer">
            <!-- Os itens serão inseridos aqui via JS -->
        </div>
    </main>

    <script>
        let items = JSON.parse(localStorage.getItem('lista_facil_items')) || [];

        function saveAndRender() {
            localStorage.setItem('lista_facil_items', JSON.stringify(items));
            render();
        }

        function addItem(e) {
            e.preventDefault();
            const nameInput = document.getElementById('itemName');
            const qtyInput = document.getElementById('itemQty');
            
            const name = nameInput.value.trim();
            const qty = parseInt(qtyInput.value) || 1;

            if (!name) return;

            const newItem = {
                id: Date.now(),
                name: name,
                qty: qty,
                purchased: false
            };

            items.unshift(newItem);
            
            nameInput.value = '';
            qtyInput.value = '1';
            nameInput.focus();

            saveAndRender();
        }

        function toggleItem(id) {
            items = items.map(item => {
                if (item.id === id) {
                    return { ...item, purchased: !item.purchased };
                }
                return item;
            });
            saveAndRender();
        }

        function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            saveAndRender();
        }

        function clearCompleted() {
            items = items.filter(item => !item.purchased);
            saveAndRender();
        }

        function render() {
            const container = document.getElementById('listContainer');
            const statsCounter = document.getElementById('statsCounter');
            const actionsBar = document.getElementById('actionsBar');

            const total = items.length;
            const purchasedCount = items.filter(i => i.purchased).length;

            statsCounter.innerText = `${purchasedCount}/${total} comprados`;

            if (total > 0) {
                actionsBar.style.display = 'flex';
            } else {
                actionsBar.style.display = 'none';
            }

            if (total === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                        <p>Sua lista está vazia.<br>Adicione produtos acima para começar.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="item-card ${item.purchased ? 'purchased' : ''}">
                    <div class="item-info" onclick="toggleItem(${item.id})">
                        <div class="checkbox"></div>
                        <div class="item-text-content">
                            <span class="item-name">${escapeHtml(item.name)}</span>
                            <span class="item-qty">Quantidade: ${item.qty}</span>
                        </div>
                    </div>
                    <button class="btn-delete" onclick="deleteItem(${item.id})" aria-label="Excluir">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Renderização inicial
        render();
    </script>
</body>
</html>
