```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .shopping-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .shopping-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            animation: fadeIn 0.3s ease;
        }

        .shopping-item:last-child {
            border-bottom: none;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .item-text {
            font-size: 1rem;
            transition: color 0.2s, text-decoration 0.2s;
            word-break: break-all;
        }

        .shopping-item.completed .item-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger);
            padding: 6px 10px;
            font-size: 0.9rem;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: var(--danger);
            color: white;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lista de Compras</h1>
        
        <form id="itemForm" class="input-group">
            <input type="text" id="itemInput" placeholder="Adicionar novo produto..." autocomplete="off" required>
            <button type="submit">Adicionar</button>
        </form>

        <ul id="shoppingList" class="shopping-list">
            <!-- Os itens serão inseridos aqui via JavaScript -->
        </ul>
    </div>

    <script>
        const itemForm = document.getElementById('itemForm');
        const itemInput = document.getElementById('itemInput');
        const shoppingList = document.getElementById('shoppingList');

        // Carregar itens do localStorage ao iniciar
        let items = JSON.parse(localStorage.getItem('shoppingList')) || [];

        function saveAndRender() {
            localStorage.setItem('shoppingList', JSON.stringify(items));
            renderList();
        }

        function renderList() {
            shoppingList.innerHTML = '';

            if (items.length === 0) {
                shoppingList.innerHTML = '<li class="empty-state">Sua lista está vazia.</li>';
                return;
            }

            items.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = `shopping-item ${item.completed ? 'completed' : ''}`;

                li.innerHTML = `
                    <div class="item-info" onclick="toggleItem(${index})">
                        <input type="checkbox" ${item.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleItem(${index})">
                        <span class="item-text">${escapeHtml(item.text)}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteItem(${index})">Excluir</button>
                `;

                shoppingList.appendChild(li);
            });
        }

        function addItem(event) {
            event.preventDefault();
            const text = itemInput.value.trim();
            
            if (text !== '') {
                items.push({ text: text, completed: false });
                itemInput.value = '';
                saveAndRender();
            }
        }

        function toggleItem(index) {
            items[index].completed = !items[index].completed;
            saveAndRender();
        }

        function deleteItem(index) {
            items.splice(index, 1);
            saveAndRender();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        itemForm.addEventListener('submit', addItem);

        // Renderização inicial
        renderList();
    </script>
</body>
</html>
