name: Fuga do Leg Day - Android

on:
  push:
    branches: [main, fuga-do-leg-day]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legday-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Dependências
        run: npm ci
      - name: Configuração mobile
        run: python3 scripts/configure_android.py
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Compilar APK release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/Fuga-do-Leg-Day-unsigned.apk
      - name: Assinar e verificar APK quando os secrets estiverem cadastrados
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 dist/Fuga-do-Leg-Day-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/Fuga-do-Leg-Day.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Fuga-do-Leg-Day.apk
          rm dist/Fuga-do-Leg-Day-unsigned.apk
      - name: Informar primeira compilação sem secrets
        if: env.KEYSTORE_BASE64 == ''
        run: echo 'APK compilado sem assinatura. Cadastrar os quatro secrets para assinar os próximos builds automaticamente.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Fuga-do-Leg-Day-Android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Limpar keystore temporário
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
