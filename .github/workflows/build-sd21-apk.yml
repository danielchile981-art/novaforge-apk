name: Gerar APK - NovaForge Imagens SD 2.1

on:
  workflow_dispatch:
  push:
    branches: [stable-diffusion-apk]
    paths:
      - "sd21-android/**"
      - ".github/workflows/build-sd21-apk.yml"

permissions:
  contents: read

concurrency:
  group: novaforge-imagens-sd21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar projeto
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Verificar scripts, tradução e filtro
        run: bash sd21-android/scripts/verify_project.sh

  compilar:
    name: Compilar APK filtrado
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Montar e compilar o aplicativo
        run: bash sd21-android/scripts/build_apk.sh

      - name: Mostrar checksum do APK
        run: cat dist-sd21/NovaForge-Imagens-SD21.apk.sha256

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: NovaForge-Imagens-SD21-APK
          path: |
            dist-sd21/NovaForge-Imagens-SD21.apk
            dist-sd21/NovaForge-Imagens-SD21.apk.sha256
          if-no-files-found: error
          retention-days: 90

